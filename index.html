<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="把小红书里想尝试的事，安排进空闲时间。" />
    <title>做一点 · 收藏夹落地器</title>
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./demo-notes.js"></script>
    <script defer src="./planner.js"></script>
    <script defer src="./demo-week.js"></script>
    <script defer src="./categories.js"></script>
    <script defer src="./plan-output.js"></script>
    <script defer src="./shared-album.js"></script>
    <script defer src="./app.js"></script>
    <script defer src="./travel-data.js"></script>
    <script defer src="./travel-planner.js"></script>
    <script defer src="./travel.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="#top" aria-label="做一点首页">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m9 9 2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
          <span>做一点</span>
        </a>
        <label class="search-box"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><input id="searchInput" type="search" placeholder="搜索收藏" aria-label="搜索收藏" /></label>
        <div class="header-actions">
          <button id="addBtn" class="button button-dark" type="button"><span aria-hidden="true">＋</span> 添加收藏</button>
        </div>
      </header>

      <main id="top">
        <nav class="workspace-tabs" aria-label="工作台"><button data-workspace="daily" class="active" aria-pressed="true">日常想做</button><button data-workspace="travel" aria-pressed="false">旅行专辑</button></nav>
        <section id="dailyWorkspace" class="workspace" aria-label="收藏与计划工作台">
          <div class="collection-column">
            <div class="section-heading">
              <div>
                <h1>收藏 <span id="collectionCount" class="count-pill">0</span></h1>
              </div>
              <div class="view-filters" role="group" aria-label="收藏状态"><button class="filter active" data-filter="all" type="button">全部</button><button class="filter" data-filter="selected" type="button">已选 <span id="selectedCount">0</span></button><button class="filter" data-filter="unready" type="button">待准备 <span id="unreadyCount">0</span></button></div>
            </div>
            <div id="collectionBrowse"><div class="daily-classify-row"><button id="classifyDaily" class="auto-classify">自动分类 ↗</button></div><div id="categoryFilters" class="filter-bar" role="group" aria-label="收藏分类"></div>
            <div id="collectionList" class="collection-list" aria-live="polite"></div></div>
            <section id="notePreview" class="note-preview" aria-label="笔记详情" hidden></section>
          </div>

          <aside class="plan-column" aria-labelledby="planTitle">
            <div class="plan-panel">
              <div class="plan-heading"><h2 id="planTitle">计划</h2><div class="plan-actions"><button id="shareDaily" class="export-link">共同专辑</button><button id="exportBtn" class="export-link" aria-label="导出 Excel">导出 Excel ↗</button></div></div>
              <div class="daily-controls-row"><div class="date-navigation"><button id="prevDate" class="date-arrow" aria-label="前一天">‹</button><input id="planDate" type="date" aria-label="计划日期"/><button id="nextDate" class="date-arrow" aria-label="后一天">›</button></div><div class="time-picker"><select id="startTime" aria-label="开始时间"></select><span>—</span><select id="endTime" aria-label="结束时间"></select></div><button id="planBtn" class="button button-coral">安排一下</button></div>
              <div id="planResult" aria-live="polite"></div>
              <div id="planNotes" class="plan-notes"></div>
            </div>
          </aside>
        </section>
        <section id="travelWorkspace" class="workspace travel-workspace" aria-label="旅行专辑工作台" hidden>
          <div class="collection-column">
            <div class="section-heading"><h1 id="albumName">旅行专辑</h1><button class="text-button" data-trip-add>＋ 添加攻略</button></div>
            <div class="library-meta-row"><p id="albumMeta" class="album-meta"></p><button id="classifyTrip" class="auto-classify">自动分类 ↗</button></div>
            <div class="trip-library-toolbar"><div id="tripViews" class="filter-bar"></div></div>
            <div id="tripLibrary"></div><section id="tripNotePanel" class="trip-note-panel" aria-label="攻略详情" hidden><div class="preview-toolbar"><button data-trip-close type="button">← 返回专辑</button></div><div id="tripNoteBody"></div></section>

          </div>
          <aside class="plan-column">
            <div class="plan-heading"><h2>旅行计划</h2><div class="plan-actions"><button id="shareTrip" class="export-link">共同专辑</button><button id="tripExport" class="export-link" disabled>导出 Excel ↗</button></div></div>
            <div class="trip-config-panel"><label class="control-caption" for="tripStart">出发日期</label><div class="date-navigation trip-date-navigation"><button id="tripPrevDate" class="date-arrow" aria-label="出发日期前一天" title="前一天">‹</button><input id="tripStart" type="date" aria-label="旅行出发日期"/><button id="tripNextDate" class="date-arrow" aria-label="出发日期后一天" title="后一天">›</button><span class="date-optional">可暂不填</span></div>
              <div class="trip-controls"><label class="inline-trip-field"><span>玩几天</span><input id="tripDayCount" type="number" min="1" max="30" step="1" value="10"/><span>天</span></label></div>
              <div class="trip-arrange-row"><span id="tripSelection"></span><button id="tripArrange" class="button button-coral">安排一下</button></div>
            </div><p id="tripStatus" class="trip-status" role="status"></p>
            <div id="tripSynthesis"></div><div id="tripRoute" class="trip-route" aria-label="行程城市"></div>
            <div id="tripItinerary"></div><div id="tripPending"></div>
            <button id="tripAddDay" class="add-day" hidden>＋ 加一天</button>

          </aside>
        </section>
      </main>
    </div>

    <dialog id="addDialog" class="add-dialog" aria-labelledby="dialogTitle">
      <form id="addForm" novalidate>
        <div class="dialog-head"><h2 id="dialogTitle">添加收藏</h2><button id="closeDialogBtn" class="icon-button" type="button" aria-label="关闭">×</button></div>
        <div class="paste-box"><label for="shareText">小红书分享文案</label><textarea id="shareText" rows="2" placeholder="粘贴链接或分享文案"></textarea><button id="parseShareBtn" class="text-button" type="button">提取标题与链接</button></div>
        <div class="dialog-grid">
          <label class="field wide"><span>想做什么 <b>*</b></span><input name="title" maxlength="60" placeholder="例如：跟着教程试一次低盘发" required /></label>
          <label class="field"><span>分类</span><select name="category" aria-describedby="categoryHint"></select><small id="categoryHint">根据标题建议，可修改</small></label>
          <label class="field"><span>大约需要（分钟）</span><input name="duration" type="number" min="5" max="720" step="5" value="30" required /></label>
          <label class="field wide"><span>在哪里做</span><select id="activityMode" name="mode"><option value="home">在家</option><option value="out">出门</option><option value="any">不限地点</option></select></label>
          <label class="field wide"><span>需要准备（可选）</span><input name="materials" maxlength="120" placeholder="例如：发圈、发夹、镜子" /></label>
          <label class="inline-check wide"><input name="prepared" type="checkbox" checked /> 已经准备好，可以开始</label>
          <label class="field wide"><span>小红书笔记链接</span><input name="url" type="url" placeholder="https://xhslink.com/..." /></label>
          <input name="sourceTitle" type="hidden" /><input name="author" type="hidden" />
        </div>
        <div id="locationFields" class="location-fields" hidden>
          <div class="dialog-grid"><label class="field"><span>区域（可选）</span><input name="area" maxlength="20" placeholder="例如：静安" /></label><label class="field"><span>具体地点（可选）</span><input name="address" maxlength="100" placeholder="出门前确认" /></label></div>
          <div class="dialog-checks"><label><input name="outdoor" type="checkbox" /> 户外活动</label><label><input name="reservation" type="checkbox" /> 需要预约</label></div>
        </div>
        <details id="advancedFields" class="advanced-fields"><summary>时间与先后顺序（可选）</summary><div class="dialog-grid"><label class="field"><span>最早开始</span><input name="open" type="time" /></label><label class="field"><span>最晚结束</span><input name="close" type="time" /></label><label class="field wide"><span>先做完这件事</span><select name="afterId"><option value="">没有先后要求</option></select></label></div><label class="inline-check"><input name="weekendsOnly" type="checkbox" /> 只能周末做</label></details>
        <label class="inline-check priority-check"><input name="priority" type="checkbox" /> 这次特别想做</label>
        <p id="formError" class="form-error" role="alert"></p>
        <div class="dialog-actions"><button id="cancelDialogBtn" class="button button-quiet" type="button">取消</button><button id="dialogSubmitBtn" class="button button-coral" type="submit">存进想做清单 →</button></div>
      </form>
    </dialog>
    <dialog id="tripEditDialog" class="add-dialog" aria-labelledby="tripEditTitle"><form id="tripNoteForm"><div class="dialog-head"><h2 id="tripEditTitle">整理攻略</h2><button type="button" data-trip-close class="icon-button" aria-label="关闭整理">×</button></div><div class="dialog-grid">
      <label class="field wide"><span>原帖标题</span><input name="title" required maxlength="160"/></label>
      <label class="field wide"><span>小红书链接</span><input name="url" type="url"/></label>
      <label class="field"><span>作者</span><input name="author" maxlength="60"/></label><label class="field"><span>分类</span><select name="kind"><option>景点</option><option>路线</option><option>交通</option><option>住宿</option><option>美食</option><option>行前准备</option></select><small id="tripCategoryHint">按标题自动分类</small></label>
      <label class="field wide"><span>想去的地点 · 每行一个</span><textarea name="places" rows="4" placeholder="城市 / 地点"></textarea><small>同城同名自动合并；需单独一天的地点可加“ / 整天”。</small></label>
      <label class="field wide"><span>记住什么 · 可选</span><textarea name="summary" rows="2" maxlength="500" placeholder="例如：需要提前预约"></textarea></label>
      </div><p id="tripFormError" class="form-error" role="alert"></p><div class="dialog-actions"><button type="button" data-trip-close class="button button-quiet">取消</button><button class="button button-coral" type="submit">保存整理</button></div></form></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
